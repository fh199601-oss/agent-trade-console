name: Platform tests and portable packages
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: windows-11-arm
            platform: windows-arm64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: trade-console
      - run: python -m unittest discover -s tests -v
      - run: npm test
        working-directory: trade-console
      - run: python tools/smoke_install.py
      - run: python tools/build_portable.py --platform ${{ matrix.platform }}
      - run: python tools/smoke_install.py --archive dist/agent-trade-console-v1.2.0-${{ matrix.platform }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
